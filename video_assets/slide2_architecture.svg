<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="80" text-anchor="middle" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#f8fafc">How it works</text>
  <text x="640" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" fill="#64748b">Gnani Prisma v2.5 · POST api.vachana.ai/stt/v3 · hi-IN / en-IN / te-IN</text>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <rect x="60" y="300" width="250" height="120" rx="12" fill="#1e293b" stroke="#34d399"/>
    <text x="185" y="352" font-size="26" fill="#f8fafc">Shopkeeper</text>
    <text x="185" y="384" font-size="18" fill="#94a3b8">speaks a sale aloud</text>

    <rect x="370" y="300" width="250" height="120" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="495" y="352" font-size="26" fill="#f8fafc">Gnani Prisma</text>
    <text x="495" y="384" font-size="18" fill="#94a3b8">speech → transcript</text>

    <rect x="680" y="300" width="250" height="120" rx="12" fill="#1e293b" stroke="#fbbf24"/>
    <text x="805" y="352" font-size="26" fill="#f8fafc">Rule-based parser</text>
    <text x="805" y="384" font-size="18" fill="#94a3b8">item, qty, unit, amount</text>

    <rect x="990" y="300" width="250" height="120" rx="12" fill="#1e293b" stroke="#f472b6"/>
    <text x="1115" y="352" font-size="26" fill="#f8fafc">sales.csv</text>
    <text x="1115" y="384" font-size="18" fill="#94a3b8">timestamped record</text>
  </g>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arr)">
    <line x1="310" y1="360" x2="365" y2="360"/>
    <line x1="620" y1="360" x2="675" y2="360"/>
    <line x1="930" y1="360" x2="985" y2="360"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="640" y="500" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#64748b">Example: "do kilo cheeni becho 60 rupaye ki" → sugar, qty 2, kg, ₹60</text>
  <text x="640" y="540" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#64748b">Quiet recordings are auto-amplified before upload · parser is trilingual in 3 scripts</text>
</svg>
